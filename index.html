<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>航空券予約サイトの画面についてのアンケート（研究用）</title>
<style>
/* =========================================================
   SORAMADO UI比較アンケート
   1) アンケートの外枠（.sv）  2) 既存の航空券予約サイト＝Trip.com型（.tc）  3) はこにわ M・MP（.hk）
   v3：スマートフォン対応（〜760px）・「いま何をする画面か」の表示・予約したチケットの横表示・予約の流れ（マイクロワールド）
   刺激を揃えるため、常にライト表示にする
   ========================================================= */
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:#F3F4F6;color:#1D2433;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #2B6CB0;outline-offset:2px}

/* ---------- 1) アンケートの外枠 ---------- */
.sv{--sv-ink:#1D2433;--sv-ink2:#4A5568;--sv-ink3:#718096;--sv-line:#D9DEE5;--sv-line2:#BAC3CF;--sv-card:#FFFFFF;--sv-acc:#2C6E63;--sv-acc-soft:#E3F1EE;--sv-bad:#C53030;--sv-bad-bg:#FDEDED;--sv-warn:#8A5A00;--sv-warn-bg:#FDF3DC;--sv-ok:#22693F;--sv-ok-bg:#E2F4E8}
.sv-top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--sv-line)}
.sv-top-in{max-width:1500px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.sv-brand{font-weight:800;letter-spacing:.04em;font-size:14px;color:var(--sv-ink)}
.sv-brand small{font-weight:600;color:var(--sv-ink3);margin-left:8px;letter-spacing:0}
.sv-prog{flex:1 1 260px;display:flex;align-items:center;gap:10px;min-width:200px}
.sv-prog-bar{flex:1;height:8px;background:#E7EAEE;border-radius:99px;overflow:hidden}
.sv-prog-bar i{display:block;height:100%;background:var(--sv-acc);border-radius:99px;transition:width .3s}
.sv-prog span{font-size:12px;color:var(--sv-ink3);white-space:nowrap}
.sv-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:2px 10px;border-radius:99px;background:#F1F3F6;border:1px solid var(--sv-line);white-space:nowrap}
.sv-chip b{font-weight:800}
.sv-wrap{max-width:860px;margin:0 auto;padding:22px 18px 80px}
.sv-wrap.wide{max-width:1500px}
.sv-card{background:var(--sv-card);border:1px solid var(--sv-line);border-radius:14px;padding:22px 24px;margin-bottom:14px}
.sv-card.tight{padding:14px 18px}
.sv-eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--sv-acc)}
.sv-h1{font-size:24px;line-height:1.45;margin:4px 0 8px;font-weight:800}
.sv-h2{font-size:19px;line-height:1.45;margin:2px 0 8px;font-weight:800}
.sv-h3{font-size:15.5px;margin:0 0 6px;font-weight:800}
.sv-lead{font-size:16px;color:var(--sv-ink2);margin:0 0 6px}
.sv-note{font-size:13px;color:var(--sv-ink2);margin:6px 0 0}
.sv-muted{color:var(--sv-ink3)}
.sv-card p{margin:0 0 8px}
.sv-card ul,.sv-card ol{margin:6px 0 8px;padding-left:1.4em}
.sv-callout{border-left:4px solid var(--sv-acc);background:var(--sv-acc-soft);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;margin:8px 0}
.sv-warnbox{border-left:4px solid var(--sv-warn);background:var(--sv-warn-bg);border-radius:0 10px 10px 0;padding:10px 14px;font-size:14px;margin:8px 0}
.sv-btn{appearance:none;border:1px solid var(--sv-acc);background:var(--sv-acc);color:#fff;font-weight:800;border-radius:10px;padding:10px 22px;min-height:46px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.sv-btn:hover{filter:brightness(1.08)}
.sv-btn.quiet{background:#fff;color:var(--sv-ink);border-color:var(--sv-line2)}
.sv-btn.small{min-height:34px;padding:5px 12px;font-size:13px;font-weight:700}
.sv-btn.danger{background:#fff;color:var(--sv-bad);border-color:var(--sv-bad)}
.sv-btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.sv-link{appearance:none;border:0;background:none;padding:0;color:#2B6CB0;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.sv-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.sv-err{color:var(--sv-bad);font-size:13px;font-weight:700}
.sv-row{display:flex;gap:8px 14px;align-items:center;flex-wrap:wrap}
.sv-spacer{flex:1 1 auto}
.sv-dl{display:grid;grid-template-columns:9em minmax(0,1fr);gap:6px 14px;margin:8px 0}
.sv-dl dt{font-weight:700;color:var(--sv-ink2)}
.sv-dl dd{margin:0}

/* 質問 */
.qlist{display:flex;flex-direction:column;gap:10px}
.q{background:#fff;border:1px solid var(--sv-line);border-radius:12px;padding:12px 16px;margin:0;min-width:0}
.q.missing{border-color:var(--sv-bad);box-shadow:0 0 0 2px var(--sv-bad-bg)}
.q-t{font-weight:700;margin-bottom:8px;display:flex;gap:10px}
.q-t .qn{font-family:ui-monospace,Menlo,monospace;color:var(--sv-ink3);flex:0 0 auto;font-weight:600}
.lk-scale{display:grid;grid-template-columns:repeat(var(--n,7),minmax(0,1fr));gap:6px}
.lk-scale label{position:relative;display:block}
.lk-scale input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.lk-scale span{display:grid;place-items:center;height:40px;border:1px solid var(--sv-line2);border-radius:8px;font-weight:700;background:#fff;cursor:pointer;font-family:ui-monospace,Menlo,monospace}
.lk-scale input:checked+span{background:var(--sv-acc);color:#fff;border-color:var(--sv-acc)}
.lk-scale input:focus-visible+span{outline:3px solid #2B6CB0;outline-offset:2px}
.lk-anc{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--sv-ink3);margin-top:4px}
.opts{display:flex;flex-direction:column;gap:6px}
.opts.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.opt{display:flex;gap:10px;align-items:center;border:1px solid var(--sv-line2);border-radius:10px;padding:8px 12px;cursor:pointer;background:#fff}
.opt input{width:18px;height:18px;margin:0;accent-color:var(--sv-acc);flex:0 0 auto}
.opt:has(input:checked){border-color:var(--sv-acc);background:var(--sv-acc-soft)}
.opt:has(input:disabled){opacity:.5;cursor:not-allowed}
.free{width:100%;border:1px solid var(--sv-line2);background:#fff;border-radius:10px;padding:9px 12px;min-height:42px}
textarea.free{min-height:72px;resize:vertical}
.vas input[type=range]{width:100%;accent-color:var(--sv-acc)}
.vas.untouched input[type=range]::-webkit-slider-thumb{opacity:.25}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:3px;flex:0 0 auto;accent-color:var(--sv-acc)}
fieldset{border:0;padding:0;margin:0;min-width:0}

/* 課題の画面（刺激）：予約メモはどの画面でもいちばん上に固定 */
.task-head{position:sticky;top:var(--top-h,44px);z-index:45;background:#FFFBEA;border-bottom:1px solid #E3CF93;box-shadow:0 4px 12px rgba(60,45,0,.08)}
.th-in{max-width:1500px;margin:0 auto;padding:8px 18px 10px}
.th-row{display:flex;gap:4px 12px;align-items:center;flex-wrap:wrap}
.th-title{font-size:14.5px;color:#4A3600}
.th-sub{font-size:12.5px;color:#5C4A16;margin:0}
dl.facts{display:flex;flex-wrap:wrap;gap:2px 22px;margin:5px 0 0}
dl.facts div{display:flex;gap:4px;align-items:baseline;font-size:13.5px;line-height:1.6;min-width:0}
dl.facts dt{color:#7A6320;font-size:12.5px;font-weight:700;white-space:nowrap}
dl.facts dt::after{content:"："}
dl.facts dd{margin:0;color:#2A2100;font-weight:700}
.task-bar{display:flex;gap:10px 16px;align-items:flex-start;flex-wrap:wrap;background:#fff;border:1px solid var(--sv-line);border-radius:12px;padding:10px 16px;margin-bottom:10px}
.task-bar .tb-main{flex:1 1 420px;min-width:0}
.task-bar .tb-title{font-weight:800;font-size:15px}
.task-bar .tb-sub{font-size:13px;color:var(--sv-ink2)}
.memo{border:1px dashed var(--sv-line2);border-radius:12px;background:#FFFDF6;padding:10px 14px;margin-bottom:10px;font-size:14px}
.memo summary{cursor:pointer;font-weight:800}
.memo ul{margin:6px 0 0;padding-left:1.3em}
.memo li+li{margin-top:2px}
.frame{border:1px solid #AEB7C4;border-radius:12px;overflow:hidden;overflow:clip;background:#fff;box-shadow:0 6px 24px rgba(20,30,50,.08)}
.frame-bar{display:flex;align-items:center;gap:10px;background:#E9ECF0;border-bottom:1px solid #C9D0D9;padding:6px 12px;font-size:12px;color:#4A5568}
.frame-bar .dots{display:flex;gap:6px}
.frame-bar .dots i{width:10px;height:10px;border-radius:50%;background:#C3CAD4;display:block}
.frame-bar .addr{flex:1;background:#fff;border:1px solid #CDD4DD;border-radius:6px;padding:1px 10px;color:#5A6577;max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame-body{position:relative;min-height:520px}
.memo-fab{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:70;appearance:none;border:1px solid #B88A1E;border-left:0;background:#FFF6DB;color:#5C4300;border-radius:0 10px 10px 0;padding:12px 5px;font-weight:800;font-size:12.5px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15);writing-mode:vertical-rl;letter-spacing:.1em}
.memo-pop{position:fixed;left:40px;top:50%;transform:translateY(-50%);z-index:71;width:min(460px,calc(100% - 32px));max-height:60vh;overflow:auto;background:#FFFDF6;border:1px solid #D9B65A;border-radius:12px;padding:12px 16px;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:14px}
.memo-pop ul{margin:6px 0;padding-left:1.3em}

/* 結果のタイムライン */
.tl{position:relative;height:96px;margin:8px 14px 0}
.tl-track{position:absolute;left:0;right:0;top:44px;height:4px;background:#DDE2E8;border-radius:2px}
.tl-fill{position:absolute;left:0;top:44px;height:4px;background:var(--sv-acc);border-radius:2px;width:0;transition:width 1.6s linear}
.tl-mark{position:absolute;top:32px;left:0;width:28px;height:28px;margin-left:-14px;border-radius:50%;background:#fff;border:3px solid var(--sv-acc);transition:left 1.6s linear}
.tl-tick{position:absolute;top:58px;transform:translateX(-50%);font-size:11.5px;color:var(--sv-ink3);white-space:nowrap;text-align:center;line-height:1.3}
.tl-tick.first{transform:none}.tl-tick.last{transform:translateX(-100%);text-align:right}
.tl-flag{position:absolute;top:0;transform:translateX(-50%);font-size:11.5px;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:6px;border:1px dashed #B4551E;color:#B4551E;background:#FBEBDD}
.outcome{border-radius:12px;padding:16px 18px;border:2px solid #B4551E;background:#FBEBDD;margin-top:8px}
.outcome.ok{border-color:var(--sv-ok);background:var(--sv-ok-bg)}
.outcome .ot{font-weight:800;font-size:17px;margin:0}
.outcome dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:10px 0 0;font-size:14px}
.outcome dt{color:var(--sv-ink2)}.outcome dd{margin:0;font-weight:700}

/* 画面の比較 */
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.thumb{border:1px solid var(--sv-line);border-radius:12px;padding:10px;background:#fff;display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb b{font-size:15px}
.thumb .tsub{font-size:12.5px;color:var(--sv-ink2)}
.thumb svg{width:100%;height:auto;border:1px solid #E1E5EA;border-radius:8px;background:#fff}
.rank-grid{width:100%;border-collapse:separate;border-spacing:0 6px}
.rank-grid th{font-size:12.5px;color:var(--sv-ink3);font-weight:700;text-align:center;padding:0 6px}
.rank-grid th:first-child{text-align:left}
.rank-grid td{background:#fff;border-top:1px solid var(--sv-line);border-bottom:1px solid var(--sv-line);padding:8px 10px;text-align:center}
.rank-grid td:first-child{border-left:1px solid var(--sv-line);border-radius:10px 0 0 10px;text-align:left;font-weight:700}
.rank-grid td:last-child{border-right:1px solid var(--sv-line);border-radius:0 10px 10px 0}
.rank-grid input{width:20px;height:20px;accent-color:var(--sv-acc);cursor:pointer}
.codebox{font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:700;letter-spacing:.08em;padding:8px 14px;border:2px dashed var(--sv-acc);border-radius:10px;display:inline-block;user-select:all}
.bignum{font-weight:900;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kv .k{font-size:12px;color:var(--sv-ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D2433;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;max-width:calc(100% - 32px)}

/* 研究者メニュー */
.lab-tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--sv-line);margin:0 0 14px}
.lab-tabs button{appearance:none;border:0;background:none;padding:8px 14px;font-weight:700;color:var(--sv-ink2);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.lab-tabs button[aria-selected="true"]{color:var(--sv-acc);border-color:var(--sv-acc)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.ctl{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-size:13.5px;margin:6px 0}
.ctl>span:first-child{min-width:12em;color:var(--sv-ink2)}
.ctl input[type=text],.ctl input[type=number],.ctl input[type=password],.ctl select{border:1px solid var(--sv-line2);background:#fff;border-radius:8px;padding:6px 10px;min-height:36px;font-size:13.5px;min-width:0}
.ctl input.wide{flex:1 1 280px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--sv-line2);border-radius:10px;overflow:hidden;background:#fff}
.seg button{appearance:none;border:0;background:none;padding:6px 12px;font-size:13px;cursor:pointer;border-right:1px solid var(--sv-line);min-height:34px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sv-acc);color:#fff;font-weight:700}
textarea.out{width:100%;min-height:160px;font-family:ui-monospace,Menlo,monospace;font-size:12px;line-height:1.5;background:#F8FAFC;border:1px solid var(--sv-line2);border-radius:8px;padding:8px;resize:vertical}
.tbl-wrap{overflow-x:auto;min-width:0}
table.rt{border-collapse:collapse;width:100%;font-size:13px;background:#fff}
.rt caption{caption-side:top;text-align:left;font-weight:800;font-size:14.5px;padding:0 0 6px;color:var(--sv-ink)}
.rt th,.rt td{border-top:1px solid #B9C2CE;border-bottom:1px solid #B9C2CE;padding:6px 9px;text-align:left;vertical-align:top}
.rt thead th{border-top:2px solid #1D2433;border-bottom:1px solid #1D2433;font-weight:700;white-space:nowrap}
.rt tbody tr:last-child td{border-bottom:2px solid #1D2433}
.rt td.r,.rt th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rt td.c,.rt th.c{text-align:center}
.rt td.sig{font-weight:700}
.rt tr.sub td{color:var(--sv-ink2);font-size:12.5px}
.tnote{font-size:12px;color:var(--sv-ink2);margin:6px 0 0;line-height:1.6}
.tblock{background:#fff;border:1px solid var(--sv-line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.tblock .tb-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:0 7px;border:1px solid var(--sv-line2);background:#F4F6F8;color:var(--sv-ink2)}
.badge.ok{background:var(--sv-ok-bg);color:var(--sv-ok);border-color:transparent}
.badge.bad{background:var(--sv-bad-bg);color:var(--sv-bad);border-color:transparent}
.badge.warn{background:var(--sv-warn-bg);color:var(--sv-warn);border-color:transparent}
.draft{white-space:pre-wrap;background:#fff;border:1px solid var(--sv-line);border-radius:12px;padding:14px 16px;font-size:14.5px;line-height:1.9}
.demo-flag{background:#FFF1C2;border:1px solid #E2B93B;color:#5C4300;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;margin-bottom:12px}

@media (max-width:760px){
  .sv-dl{grid-template-columns:minmax(0,1fr)}
  .thumbs{grid-template-columns:minmax(0,1fr)}
  .lk-scale span{height:36px}
}

/* ---------- v3：いま何をする画面か（帯の色と文字） ---------- */
.ph{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;border-radius:99px;padding:2px 10px;white-space:nowrap;border:1px solid transparent;letter-spacing:.02em}
.ph::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ph-q{background:#E3F1EE;color:#1F5B51;border-color:#A9D3C9}
.ph-task{background:#FDE7D2;color:#9A4510;border-color:#F0B98C}
.ph-prep{background:#FFF3C4;color:#6B5000;border-color:#E9CF6E}
.ph-result{background:#E6EDF9;color:#24448A;border-color:#B7C8EC}
.ph-info,.ph-end{background:#EEF0F3;color:#3C4657;border-color:#D3D8DF}
.ph-banner{display:flex;gap:10px;align-items:baseline;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px;border:1px solid}
.ph-banner .ph-k{font-weight:900;white-space:nowrap;font-size:13px}
.ph-banner.ph-q{background:#EEF8F5}.ph-banner.ph-prep{background:#FFF9DF}.ph-banner.ph-task{background:#FFF3E8}
.kind2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.kind{border-radius:12px;padding:10px 12px;border:1px solid var(--sv-line)}
.kind p{margin:6px 0 0;font-size:14px}
.kind.task{background:#FFF7EF;border-color:#F0B98C}.kind.q{background:#F2FAF7;border-color:#A9D3C9}
.flow-steps{list-style:none;padding:0!important;margin:6px 0;display:flex;flex-direction:column;gap:6px;counter-reset:fs}
.flow-steps li{counter-increment:fs;display:block;background:#FAFBFC;border:1px solid var(--sv-line);border-radius:10px;padding:8px 12px 8px 40px;position:relative;font-size:14px}
.flow-steps li::before{content:counter(fs);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:#fff;border:1px solid var(--sv-line2);display:grid;place-items:center;font-size:12px;font-weight:800}
.flow-steps .ph{margin-right:8px}
.transit{text-align:left;border-width:2px}
.transit.task{border-color:#F0B98C;background:linear-gradient(180deg,#FFF7EF,#fff 120px)}
.transit.q{border-color:#A9D3C9;background:linear-gradient(180deg,#EEF8F5,#fff 120px)}
.transit-ic svg{width:52px;height:52px;display:block;margin-bottom:6px}
.sv-btn.task{background:#C25A12;border-color:#C25A12}
.guide{background:#FAFBFC;border:1px solid var(--sv-line);border-radius:12px;padding:10px 14px}
.guide-t{font-weight:800;margin:0 0 4px}
.guide ol{margin:0;padding-left:1.3em;font-size:14px}
.guide li+li{margin-top:4px}
.mc-fb{margin:8px 0 0;font-size:13.5px;font-weight:700}
.mc-fb.ok{color:var(--sv-ok)}.mc-fb.ng{color:var(--sv-bad)}
/* 予約作業の画面：上の予約メモ */
.th-row .ph{flex:0 0 auto}
.th-help{margin-left:auto;appearance:none;border:1px solid #D9B65A;background:#fff;color:#5C4300;border-radius:8px;padding:2px 10px;font-size:12.5px;font-weight:700;cursor:pointer;min-height:30px}
.th-mini{display:none}
.th-mini summary{cursor:pointer;list-style:none;display:flex;gap:8px;align-items:baseline;font-size:13px;font-weight:700;color:#2A2100}
.th-mini summary::-webkit-details-marker{display:none}
.th-mini .th-open{margin-left:auto;color:#2B6CB0;font-size:12px;white-space:nowrap;text-decoration:underline}
.th-mini[open] .th-open{display:none}
.th-guide{margin-top:8px;background:#fff;border:1px solid #E3CF93;border-radius:10px;padding:10px 12px;max-height:46vh;overflow:auto}
.th-guide .guide{border:0;padding:0;background:none;margin-bottom:8px}
/* アンケートの画面：予約したチケットを横に出す */
.sv-wrap.qside{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.qmain{min-width:0}
.tkt{position:sticky;top:calc(var(--top-h,44px) + 12px);min-width:0}
.tkt-d{background:#fff;border:2px solid #A9D3C9;border-radius:14px;padding:14px 16px;font-size:13.5px;max-height:calc(100vh - var(--top-h,44px) - 24px);overflow:auto}
.tkt-m{display:none}
.tk-k{font-size:12px;font-weight:800;color:#1F5B51;margin:0 0 6px;letter-spacing:.04em}
.tk-plan{display:flex;gap:8px;align-items:center;font-size:16px}
.tk-sub{font-size:12px;color:var(--sv-ink3);margin-top:2px}
.tk-al{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 6px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px}
.tk-al.P{color:#8A5A00;background:#FBF0D9}.tk-al.J{color:#0E6B6B;background:#DDF2F0}.tk-al.A{color:#5B3FA0;background:#ECE6F8}
.tk-dl{display:grid;grid-template-columns:6.6em minmax(0,1fr);gap:4px 10px;margin:10px 0 0;font-size:13px}
.tk-dl dt{color:var(--sv-ink3);font-weight:700}.tk-dl dd{margin:0}
.tk-rules{margin-top:10px;border-top:1px dashed var(--sv-line);padding-top:8px}
.tk-rules summary{cursor:pointer;font-weight:700;font-size:13px;color:#2B6CB0}
.tk-note{font-size:12px;color:var(--sv-ink3);margin:10px 0 0;background:#F6F7F9;border-radius:8px;padding:6px 8px}
.tk-memo{font-size:12.5px;color:#5C4A16;background:#FFFBEA;border-radius:8px;padding:6px 8px;margin:10px 0 0}
/* 答え合わせ */
.ans{border:1px solid var(--sv-line);border-radius:12px;padding:10px 14px;margin:10px 0}
.ans-h{font-weight:800;margin:0 0 6px}
.ans .rt .best{background:#EEF8F5}
.ans-t td.r,.ans-t th.r{white-space:normal}
.ans-n{margin:8px 0 4px;padding-left:1.2em;font-size:14px}
.ans-n li.ok{color:var(--sv-ok);font-weight:700}.ans-n li.ng{color:var(--sv-bad);font-weight:700}
.thumb .tsub2{display:block;font-size:12px;font-weight:600;color:var(--sv-ink2)}

/* ---------- 2) 既存の航空券予約サイト（Trip.com型の再現） ---------- */
.tc{--tc-blue:#2C61FE;--tc-blue-d:#1E4FE0;--tc-ink:#121826;--tc-sub:#5E6B80;--tc-sub2:#8592A6;--tc-line:#DADFE6;--tc-bg:#EBEDF1;--tc-teal:#047C88;--tc-orange:#C74401;--tc-red:#D93A3A;
  background:var(--tc-bg);color:var(--tc-ink);font-family:"Hiragino Kaku Gothic Pro","ヒラギノ角ゴ Pro W3","Hiragino Sans","Meiryo UI","Meiryo","Noto Sans JP",sans-serif;font-size:14px;line-height:1.5}
.tc *{box-sizing:border-box}
.tc button{font-family:inherit}
.tc-hero{background:linear-gradient(90deg,#2F5CFF 0%,#3A6BFF 60%,#4A78FF 100%);padding:0 0 46px;color:#fff}
.tc-sheetwrap{background:var(--tc-bg);border-radius:24px 24px 0 0;margin-top:-24px;position:relative}
.tc-nav{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:22px;padding:10px 20px 0;flex-wrap:wrap}
.tc-logo{font-weight:900;font-size:20px;letter-spacing:.02em;color:#fff;white-space:nowrap}
.tc-nav a{color:#fff;opacity:.95;font-size:14px;text-decoration:none;padding:6px 0 8px;border-bottom:2px solid transparent;white-space:nowrap}
.tc-nav a.on{border-color:#fff;font-weight:700}
.tc-nav .tc-right{margin-left:auto;display:flex;gap:16px;font-size:13px;align-items:center}
.tc-nav .tc-right span{opacity:.95}
.tc-search{max-width:1140px;margin:12px auto 0;background:#fff;border-radius:8px;box-shadow:0 4px 18px rgba(15,41,77,.18);padding:12px 16px 14px;color:var(--tc-ink)}
.tc-way{display:flex;gap:18px;font-size:13px;margin-bottom:8px;flex-wrap:wrap}
.tc-way label{display:flex;align-items:center;gap:6px;color:var(--tc-ink)}
.tc-way input{accent-color:var(--tc-blue)}
.tc-fields{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr) minmax(0,.9fr) minmax(0,.9fr) auto;gap:8px;align-items:center}
.tc-field{border:1px solid var(--tc-line);border-radius:4px;height:46px;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden}
.tc-field .ic{color:var(--tc-sub2);flex:0 0 auto}
.tc-swap{width:28px;height:28px;border-radius:50%;border:1px solid var(--tc-line);display:grid;place-items:center;color:var(--tc-blue);background:#fff;font-size:13px}
.tc-go{appearance:none;border:0;background:var(--tc-blue);color:#fff;border-radius:4px;height:46px;padding:0 24px;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.tc-body{max-width:1180px;margin:0 auto;padding:0 20px 40px;position:relative}
.tc-sheet{background:var(--tc-bg);border-radius:20px 20px 0 0;padding:14px 0 0}
.tc-dates{display:flex;align-items:stretch;background:#fff;border-radius:6px;overflow:hidden;margin-bottom:12px}
.tc-dates .arr{width:40px;display:grid;place-items:center;color:var(--tc-sub);font-size:18px}
.tc-dates .d{flex:1;text-align:center;padding:8px 4px 6px;font-size:13px;border-bottom:2px solid transparent;color:var(--tc-ink);min-width:0}
.tc-dates .d small{display:block;color:var(--tc-sub2);font-size:11px}
.tc-dates .d.on{font-weight:700;border-color:var(--tc-ink)}
.tc-dates .d.on small{color:var(--tc-ink)}
.tc-dates .graph{width:90px;border-left:1px solid var(--tc-line);display:grid;place-items:center;font-size:12px;color:var(--tc-sub)}
.tc-main{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
.tc-filter{padding:4px 2px}
.tc-ftoggle{display:none;appearance:none;border:1px solid var(--tc-line);background:#fff;border-radius:6px;padding:10px 14px;font-size:14px;font-weight:700;color:var(--tc-ink);cursor:pointer;justify-content:space-between;align-items:center;width:100%}
.tc-filter h3{font-size:17px;margin:4px 0 2px;display:flex;justify-content:space-between;align-items:baseline}
.tc-filter h3 button{appearance:none;border:0;background:none;color:var(--tc-blue);font-size:13px;cursor:pointer;font-weight:400}
.tc-filter .cnt{font-size:12px;color:var(--tc-sub);margin-bottom:10px}
.tc-fsec{border-top:1px solid #D2D7DF;padding:12px 0}
.tc-fsec h4{font-size:14px;margin:0 0 8px;display:flex;justify-content:space-between}
.tc-fsec h4::after{content:"︿";color:var(--tc-sub2);font-weight:400}
.tc-fsec .sel{font-size:12px;color:var(--tc-blue);margin-bottom:6px;display:flex;gap:12px}
.tc-fsec .sel button{appearance:none;border:0;background:none;color:var(--tc-blue);cursor:pointer;padding:0;font-size:12px}
.tc-fopt{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 0;cursor:pointer}
.tc-fopt input{width:16px;height:16px;margin:0;accent-color:var(--tc-blue)}
.tc-fopt .nm{flex:1;min-width:0}
.tc-fopt .pr{color:var(--tc-sub);font-size:12px}
.tc-fsub{font-size:12px;color:var(--tc-sub);margin:4px 0 2px}
.tc-banner{height:46px;border-radius:6px 6px 0 0;background:linear-gradient(90deg,#1B2A4E 0%,#2A3F71 55%,#3F5A98 100%);color:#fff;font-weight:700;display:flex;align-items:center;padding:0 16px;font-size:15px}
.tc-sorts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,1.2fr);background:#fff;border-bottom:1px solid var(--tc-line);margin-bottom:10px}
.tc-sorts button{appearance:none;border:0;background:none;padding:9px 6px 7px;cursor:pointer;font-size:13.5px;color:var(--tc-ink);border-bottom:2px solid transparent;position:relative;border-right:1px solid #EEF0F3}
.tc-sorts button small{display:block;font-size:12px;color:var(--tc-sub)}
.tc-sorts button.on{font-weight:700;border-bottom-color:var(--tc-ink)}
.tc-sorts .alert{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:700;color:var(--tc-ink)}
.tc-sortmenu{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--tc-line);box-shadow:0 6px 18px rgba(0,0,0,.12);z-index:5;text-align:left;font-weight:400}
.tc-sortmenu div{padding:8px 12px;font-size:13px;cursor:pointer}
.tc-sortmenu div:hover,.tc-sortmenu div.on{background:#F0F4FF;color:var(--tc-blue)}
.tc-card{background:#fff;border-radius:4px;margin-bottom:8px;padding:10px 18px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;border:1px solid transparent}
.tc-card:hover{border-color:#B9C8F5;box-shadow:0 2px 10px rgba(44,97,254,.10)}
.tc-tags{grid-column:1 / -1;display:flex;gap:6px;min-height:6px}
.tc-tag{font-size:11px;color:#fff;background:var(--tc-teal);border-radius:2px;padding:0 6px;line-height:18px}
.tc-tag.line{background:#fff;color:var(--tc-teal);border:1px solid #9CCED3}
.tc-fl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;align-items:center;min-width:0}
.tc-al{display:flex;gap:10px;align-items:center;min-width:0}
.tc-logo-al{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:800;color:#fff;flex:0 0 auto;letter-spacing:.02em}
.tc-logo-al.P{background:#D6338A}.tc-logo-al.J{background:#C8102E}.tc-logo-al.A{background:#13448F}
.tc-al .nm{font-size:13.5px;line-height:1.35}
.tc-al .lcc{display:block;color:var(--tc-orange);font-size:12.5px}
.tc-times{display:grid;grid-template-columns:auto minmax(80px,170px) auto;gap:12px;align-items:center;justify-content:start}
.tc-t{text-align:center}
.tc-t b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.tc-t small{font-size:12px;color:var(--tc-sub)}
.tc-dur{text-align:center;font-size:11px;color:var(--tc-sub2)}
.tc-dur i{display:block;height:0;border-top:2px solid #C9CFD8;margin:3px 0;position:relative}
.tc-dur i::before,.tc-dur i::after{content:"";position:absolute;top:-4px;width:6px;height:6px;border-radius:50%;background:#C9CFD8}
.tc-dur i::before{left:-2px}.tc-dur i::after{right:-2px}
.tc-pr{display:flex;align-items:center;gap:12px}
.tc-price{color:var(--tc-blue);font-size:20px;font-weight:700;white-space:nowrap;text-align:right}
.tc-price small{display:block;color:var(--tc-sub2);font-size:11px;font-weight:400}
.tc-btn{appearance:none;border:0;background:var(--tc-blue);color:#fff;border-radius:4px;padding:0 16px;height:38px;font-size:15px;font-weight:500;cursor:pointer;white-space:nowrap}
.tc-btn:hover{background:var(--tc-blue-d)}
.tc-btn.full{width:100%}
.tc-btn.ghost{background:#fff;color:var(--tc-blue);border:1px solid var(--tc-blue)}
.tc-note{font-size:12px;color:var(--tc-sub);margin:6px 2px}
/* 運賃の選択（右から出るパネル） */
.tc-backdrop{position:fixed;inset:var(--ovl-top,0px) 0 0 0;background:rgba(15,20,30,.45);z-index:60}
.tc-drawer{position:fixed;top:var(--ovl-top,0px);right:0;bottom:0;width:min(1000px,78vw);background:#F4F5F7;z-index:61;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.tc-dh{background:#fff;padding:16px 22px 10px;display:flex;align-items:center;gap:12px}
.tc-dh h2{font-size:20px;margin:0;font-weight:700;flex:1;display:flex;align-items:center;gap:10px}
.tc-dh .x{appearance:none;border:0;background:none;font-size:26px;line-height:1;cursor:pointer;color:var(--tc-ink)}
.tc-dh .back{appearance:none;border:0;background:none;font-size:22px;cursor:pointer;color:var(--tc-ink);padding:0 4px}
.tc-dfl{background:#fff;padding:6px 22px 14px;display:flex;align-items:center;gap:12px;font-size:12.5px;border-bottom:1px solid var(--tc-line);flex-wrap:wrap}
.tc-dfl b{font-size:13px}
.tc-dbody{flex:1;overflow:auto;padding:18px 22px 30px}
.tc-dbody h3{font-size:19px;margin:0 0 14px}
.tc-fares{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.tc-fare{background:#fff;border:1px solid var(--tc-line);border-radius:8px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.tc-fare.rec{border-color:#9DB4FB}
.tc-fare .badge-rec{position:absolute;top:-10px;left:12px;background:var(--tc-teal);color:#fff;font-size:11px;padding:0 6px;border-radius:2px}
.tc-fare .fp{color:var(--tc-blue);font-size:20px;font-weight:700;display:flex;align-items:center;gap:6px}
.tc-fare .fp button{appearance:none;border:1px solid var(--tc-sub2);background:#fff;border-radius:50%;width:16px;height:16px;font-size:10px;line-height:14px;color:var(--tc-sub);cursor:pointer;padding:0;position:relative}
.tc-fare .fn{font-size:12px;color:var(--tc-sub);border-bottom:1px solid #E6E9EE;padding-bottom:10px;margin-bottom:4px;min-height:38px}
.tc-fare h5{font-size:13.5px;margin:6px 0 2px}
.tc-fl-line{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--tc-ink);line-height:1.5}
.tc-fl-line .i{width:14px;flex:0 0 14px;color:var(--tc-sub);text-align:center;font-size:12px}
.tc-fl-line .i.no{color:var(--tc-sub)}
.tc-fl-line .i.yes{color:#0E8A5F}
.tc-fl-line.link{cursor:pointer}
.tc-fl-line.link:hover span:last-child{text-decoration:underline dotted;color:var(--tc-blue)}
.tc-fare .spacer{flex:1}
.tc-fare .pay{border:1px solid var(--tc-line);border-radius:4px;font-size:12px;padding:6px 10px;color:var(--tc-sub);margin-top:6px}
.tc-tip{position:absolute;left:0;top:26px;z-index:3;width:250px;background:#fff;border:1px solid var(--tc-line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.16);padding:10px 12px;font-size:12px;color:var(--tc-ink);font-weight:400}
.tc-tip .t1{text-align:right;color:var(--tc-blue);font-weight:700;font-size:15px}
.tc-tip .t2{text-align:right;color:var(--tc-sub);margin-bottom:6px}
.tc-tip .ln{display:flex;justify-content:space-between;padding:2px 0}
.tc-tip .ln.sub{color:var(--tc-sub)}
.tc-tip .ln.tot{border-top:1px solid var(--tc-line);margin-top:6px;padding-top:6px;font-weight:700}
.tc-rtabs{display:flex;gap:22px;background:#fff;padding:0 22px;border-bottom:1px solid var(--tc-line);font-size:13px}
.tc-rtabs button{appearance:none;border:0;background:none;padding:8px 0;cursor:pointer;border-bottom:2px solid transparent;color:var(--tc-ink)}
.tc-rtabs button.on{border-color:var(--tc-ink);font-weight:700}
.tc-rsec{background:#fff;border-radius:6px;padding:14px 16px;margin-bottom:12px;font-size:13px}
.tc-rsec h4{font-size:15px;margin:0 0 10px}
.tc-rt{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 10px}
.tc-rt th{background:#F4F5F7;text-align:left;font-weight:700;padding:7px 10px;border:1px solid #E3E6EB}
.tc-rt td{padding:8px 10px;border:1px solid #E3E6EB;vertical-align:top}
.tc-rt td.now{border-left:3px solid var(--tc-blue)}
.tc-rt td .nowl{display:block;color:var(--tc-blue);font-weight:700;font-size:12px}
.tc-rt td.ng{color:var(--tc-red)}
.tc-rsec .rm{font-size:12px;color:var(--tc-sub);line-height:1.7}
.tc-rsec .rm b{color:var(--tc-ink)}
/* 予約内容の入力 */
.tc-book{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
.tc-steps{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--tc-sub);margin-bottom:14px;flex-wrap:wrap}
.tc-steps .s{display:flex;align-items:center;gap:6px}
.tc-steps .s i{width:20px;height:20px;border-radius:50%;background:#C9CFD8;color:#fff;font-style:normal;display:grid;place-items:center;font-size:12px;font-weight:700}
.tc-steps .s.on{color:var(--tc-ink);font-weight:700}
.tc-steps .s.on i{background:var(--tc-blue)}
.tc-steps .bar{width:40px;height:1px;background:#C9CFD8}
.tc-bgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.tc-bcard{background:#fff;border-radius:6px;padding:16px 18px;margin-bottom:12px}
.tc-bcard h3{font-size:17px;margin:0 0 10px}
.tc-bcard .sub{font-size:12.5px;color:var(--tc-sub)}
.tc-optrow{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:10px 16px;align-items:center;padding:12px 0;border-top:1px solid #EEF0F3}
.tc-optrow:first-of-type{border-top:0}
.tc-optrow .lbl{font-weight:700;font-size:14px}
.tc-optrow .desc{font-size:12.5px;color:var(--tc-sub)}
.tc-step{display:flex;align-items:center;gap:8px}
.tc-step button{appearance:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--tc-blue);background:#fff;color:var(--tc-blue);font-size:16px;cursor:pointer;line-height:1}
.tc-step button[disabled]{border-color:#C9CFD8;color:#C9CFD8;cursor:not-allowed}
.tc-step b{min-width:24px;text-align:center}
.tc-toggle{display:inline-flex;border:1px solid var(--tc-line);border-radius:4px;overflow:hidden}
.tc-toggle button{appearance:none;border:0;background:#fff;padding:6px 12px;font-size:13px;cursor:pointer;border-right:1px solid var(--tc-line)}
.tc-toggle button:last-child{border-right:0}
.tc-toggle button.on{background:#EEF3FF;color:var(--tc-blue);font-weight:700}
.tc-toggle button[disabled]{color:#B8C0CC;cursor:not-allowed}
.tc-sum{position:sticky;top:calc(var(--ovl-top,60px) + 10px);background:#fff;border-radius:6px;padding:16px 18px}
.tc-sum h3{font-size:16px;margin:0 0 10px}
.tc-sum .ln{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
.tc-sum .ln.sub{color:var(--tc-sub);padding-left:10px;font-size:12.5px}
.tc-sum .tot{border-top:1px solid var(--tc-line);margin-top:8px;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline;font-weight:700}
.tc-sum .tot b{color:var(--tc-blue);font-size:22px}
.tc-mute{background:#F6F7F9;border:1px dashed #C9CFD8;border-radius:6px;padding:10px 12px;font-size:12.5px;color:var(--tc-sub)}
@media (max-width:1100px){
  .tc-main{grid-template-columns:minmax(0,1fr);gap:10px}
  .tc-filter{display:none}
  .tc-filter.open{display:block;background:#fff;border-radius:6px;padding:4px 14px}
  .tc-ftoggle{display:flex}
  .tc-fields{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .tc-fields .tc-swap{display:none}
  .tc-go{grid-column:1 / -1;justify-content:center}
  .tc-bgrid{grid-template-columns:minmax(0,1fr)}
  .tc-fares{grid-template-columns:minmax(0,1fr)}
  .tc-drawer{width:100%}
}

/* ---------- 3) はこにわ（M・MP） ---------- */
.hk{--paper:#F1F4F8;--surface:#FFFFFF;--surface-2:#F6F8FB;--grid:#E3E9F1;--ink:#132033;--ink-2:#46556A;--ink-3:#66768C;--line:#D8E0EA;--line-2:#BCC8D8;
  --brand:#2B4F9E;--brand-ink:#FFFFFF;--brand-soft:#E6EDF9;--sky:#3E8FD0;--plan:#132033;--if:#B4551E;--if-soft:#FBEBDD;--exp:#2B4F9E;
  --ok:#0A6A4B;--ok-bg:#DFF3EA;--warn:#875000;--warn-bg:#FDF1D3;--bad:#B42318;--bad-bg:#FDECEA;

/* ============================================================
   engine.js — 規定の計算・見込み・最適プラン・乱数・割付（画面に依存しない関数）
   ============================================================ */
const fmtN = n => Math.round(n).toLocaleString('ja-JP');
const yen = n => '¥' + fmtN(n);
const yenJ = n => fmtN(n) + '円';
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

let ROUTE = 'CTS', PLANS = ROUTES.CTS.plans, FLIGHTS = ROUTES.CTS.flights;
function setRoute(code) { const R = ROUTES[code] || ROUTES.CTS; ROUTE = R.code; PLANS = R.plans; FLIGHTS = R.flights; }
function withRoute(code, fn) { const prev = ROUTE; setRoute(code); try { return fn(); } finally { setRoute(prev); } }
const curRoute = () => ROUTES[ROUTE];
const planById = id => PLANS.find(p => p.id === id) || null;
const flightOf = p => FLIGHTS[p.flight];
const planName = p => `${AIRLINES[p.al].name} ${p.fare}`;

/* 税抜運賃額（JAL・ANA の手数料の基準）＝（支払額 − 旅客施設使用料）÷ 1.1 */
function exTax(p) { return Math.round((p.price - (p.parts.pfc || 0)) / 1.1); }

function bagFees(p, bags, kg) {
  const n = Math.max(0, bags | 0);
  switch (p.kind) {
    case 'peachMin': return { pre: n * 2000, apt: 0, note: n ? `${n}個×2,000円（予約時に購入）` : '預けない' };
    case 'peachStd': case 'peachPlus': { const extra = Math.max(0, n - 1); return { pre: extra * 2000, apt: 0, note: n ? (extra ? `1個無料＋${extra}個×2,000円（予約時に購入）` : '1個無料') : '預けない' }; }
    case 'jalSS': case 'jalSV': case 'jalFX': { const over = Math.max(0, n * kg - 20); return { pre: 0, apt: over * 440, note: n ? (over ? `合計${n * kg}kg：20kgを超える${over}kg×440円（空港で支払い）` : `合計${n * kg}kg：20kgまで無料`) : '預けない' }; }
    case 'anaSimple': { const extra = Math.max(0, n - 1); return { pre: 0, apt: extra * 5500, note: n ? (extra ? `1個無料＋${extra}個×5,500円（空港で支払い）` : '1個無料') : '預けない' }; }
    case 'anaStd': case 'anaFlex': { const extra = Math.max(0, n - 2); return { pre: 0, apt: extra * 5500, note: n ? '2個まで無料' : '預けない' }; }
    default: return { pre: 0, apt: 0, note: '' };
  }
}
function seatFee(p, seat) {
  if (!seat) return { pre: 0, ok: true, note: '選ばない' };
  if (p.kind === 'peachMin') return { pre: 800, ok: true, note: '800円（バックエリア）' };
  if (p.kind === 'anaSimple') return { pre: 0, ok: false, note: '予約時は選べない（24時間前から）' };
  return { pre: 0, ok: true, note: '無料' };
}
/* 取り消し：出発の d 日前。運賃部分の手数料と戻り方（オプション料金は戻らない） */
function cancelRule(p, d) {
  const ex = exTax(p);
  const pct = r => ({ fee: Math.round(ex * r), cash: p.price - Math.round(ex * r), points: 0, rate: r });
  switch (p.kind) {
    case 'peachMin': return { fee: p.price, cash: 0, points: 0, text: '全額が取消手数料（払い戻しなし）' };
    case 'peachStd': { const fee = d >= 30 ? 1000 : 3000; return { fee, cash: 0, points: p.price - fee, text: `取消手数料 ${yenJ(fee)}・残りはピーチポイント` }; }
    case 'peachPlus': return { fee: 500, cash: p.price - 500, points: 0, text: '取消手数料 500円・残りは払い戻し' };
    case 'jalSS': { const r = d >= 55 ? 0.05 : 0.5; return Object.assign(pct(r), { text: `税抜運賃の約${r * 100}%` }); }
    case 'jalSV': return Object.assign(pct(0.05), { text: '税抜運賃の約5%' });
    case 'jalFX': return { fee: 0, cash: p.price, points: 0, text: '無料' };
    case 'anaSimple': { const r = d >= 45 ? 0.2 : d >= 28 ? 0.4 : 0.6; return Object.assign(pct(r), { text: `税抜運賃の約${r * 100}%` }); }
    case 'anaStd': { const r = d >= 45 ? 0.1 : d >= 28 ? 0.2 : 0.3; return Object.assign(pct(r), { text: `税抜運賃の約${r * 100}%` }); }
    case 'anaFlex': return { fee: 500, cash: p.price - 500, points: 0, text: '500円' };
    default: return { fee: p.price, cash: 0, points: 0, text: '' };
  }
}
/* 予約変更：出発の d 日前（運賃差額は 0 と仮定） */
function changeRule(p, d) {
  switch (p.kind) {
    case 'peachPlus': return { possible: true, fee: 0, optionsLost: true, text: '変更無料（オプションは買い直し）' };
    case 'jalFX': return { possible: true, fee: 0, optionsLost: false, text: '変更無料' };
    case 'anaFlex': return { possible: true, fee: 0, optionsLost: false, text: '変更無料' };
    case 'anaStd': { const r = d >= 45 ? 0.05 : d >= 28 ? 0.08 : 0.10; const fee = Math.round(exTax(p) * r); return { possible: true, fee, optionsLost: false, text: `変更手数料 約${Math.round(r * 100)}%（${yenJ(fee)}）` }; }
    default: return { possible: false, fee: 0, optionsLost: false, text: '変更不可（取り消して買い直し）' };
  }
}
/* 1つのプランを前提 k で評価する
   planned  ：予定どおりの場合に出ていくお金（運賃＋予約時のオプション＋空港での手荷物料金＋交通費）
   penalty  ：もしもの別料金。予定変更が起きたときに、予定どおりの支払いに加えて失う・追加でかかるお金
              取りやめ → 戻らないお金（取消手数料＋戻らないオプション＋使わないポイント）
              日程変更 → 乗り直しの追加費用（変更手数料・オプションの買い直し、変更できなければ取り消して買い直したときに戻らないお金）
   ifTotal  ：もしもの時 ＝ planned ＋ penalty（画面の◇の位置。別料金が大きいほど●から離れる）
   expected ：見込み ＝ planned ＋ p × penalty（▲の位置。最適プラン・見込み損失の基準）
   ifCost   ：予定変更が起きたときに実際に出ていくお金（結果の判定に使う。取りやめなら戻らないお金だけ）
   expectedSpend：(1 − p)·planned ＋ p·ifCost（実際に出ていくお金の期待値。感度分析用） */
function evalPlan(p, k) {
  const f = flightOf(p), bag = bagFees(p, k.bags, k.kg), seat = seatFee(p, k.seat);
  const pre = bag.pre + seat.pre, apt = bag.apt;
  const acc = k.access ? (f.from === 'HND' ? (+k.accHND || 0) : (+k.accNRT || 0)) : 0;
  const planned = p.price + pre + apt + acc;
  const c = cancelRule(p, k.days);
  let penalty, ifCost, ch = null, how = '', parts = [];
  if (k.type === 'change') {
    ch = changeRule(p, k.days);
    if (ch.possible) { penalty = ch.fee + (ch.optionsLost ? pre : 0); how = ch.text; parts = [['変更手数料', ch.fee]].concat(ch.optionsLost && pre ? [['オプションの買い直し', pre]] : []); }
    else { penalty = p.price + pre - c.cash - c.points; how = '変更できないため取り消して買い直し'; parts = [['取り消して戻らないお金', penalty]]; }
    ifCost = planned + penalty;
  } else {
    const fee = p.price - c.cash - c.points, lostPts = k.pv ? 0 : c.points;
    penalty = fee + pre + lostPts; ifCost = penalty; how = c.text;
    parts = [[p.kind === 'peachMin' ? '取消手数料（運賃の全額）' : '取消手数料', fee]].concat(pre ? [['戻らないオプション', pre]] : [], lostPts ? [['使わないポイント', lostPts]] : []);
  }
  const pr = Math.max(0, Math.min(1, +k.p || 0));
  return { id: p.id, planned, penalty, ifTotal: planned + penalty, expected: planned + pr * penalty, ifCost, expectedSpend: (1 - pr) * planned + pr * ifCost,
    parts, pre, apt, acc, bag, seat, cancel: c, change: ch || changeRule(p, k.days), how, feasible: seat.ok, refundCash: c.cash, refundPoints: c.points };
}
function evalAll(k) { const o = {}; PLANS.forEach(p => { o[p.id] = evalPlan(p, k); }); return o; }
const METRICS = {
  price: { label: '運賃だけ', get: (p) => p.price },
  planned: { label: '予定どおりの支払い', get: (p, e) => e.planned },
  penalty: { label: 'もしもの別料金', get: (p, e) => e.penalty },
  expected: { label: '見込み', get: (p, e) => e.expected },
};
function ranking(evals, metric) {
  const m = METRICS[metric] || METRICS.price;
  return PLANS.slice().sort((a, b) => m.get(a, evals[a.id]) - m.get(b, evals[b.id]) || a.price - b.price || PLANS.indexOf(a) - PLANS.indexOf(b)).map(p => p.id);
}
/* 課題の「本当の状況」 */
function trueK(trip) { return Object.assign({}, trip.truth, { accHND: trip.access.HND, accNRT: trip.access.NRT }); }
function optimalOf(trip, key) { const kk = key || 'expected', ev = evalAll(trueK(trip)); return PLANS.filter(p => ev[p.id].feasible).reduce((a, b) => (ev[a.id][kk] <= ev[b.id][kk] ? a : b)).id; }
/* 参加者が実際に買ったオプション B と、本当の状況での費用（足りない手荷物は空港で買う。Peach は1個 3,100円） */
function actualEval(p, trip, B) {
  const T = trueK(trip), need = T.bags, kg = T.kg;
  const pre = bagFees(p, B.bags, kg).pre + seatFee(p, B.seat).pre;
  let apt = bagFees(p, need, kg).apt;
  if (p.kind.indexOf('peach') === 0) { const allow = p.kind === 'peachMin' ? 0 : 1; apt += Math.max(0, Math.max(0, need - allow) - Math.max(0, B.bags - allow)) * 3100; }
  const acc = T.access ? (flightOf(p).from === 'HND' ? T.accHND : T.accNRT) : 0;
  const planned = p.price + pre + apt + acc;
  const c = cancelRule(p, T.days), ch = changeRule(p, T.days);
  let penalty, ifCost, line;
  if (T.type === 'change') {
    penalty = ch.possible ? ch.fee + (ch.optionsLost ? pre : 0) : (p.price + pre - c.cash - c.points);
    ifCost = planned + penalty;
    line = ch.possible ? `予約変更：${ch.text}。乗り直しの追加 ${yenJ(penalty)}` : `変更できないため取り消して買い直し（取消：${c.text}${c.points ? '。戻ったポイントは乗り直しに使う' : ''}）。追加 ${yenJ(penalty)}`;
  } else {
    penalty = p.price + pre - c.cash - (T.pv ? c.points : 0); ifCost = penalty;
    line = `取消：${c.text}。現金で戻る ${yenJ(c.cash)}${c.points ? `、ポイントで戻る ${yenJ(c.points)}${T.pv ? '' : '（今後使う予定がないため0円と数える）'}` : ''}${pre ? `。事前に買ったオプション ${yenJ(pre)} は戻らない` : ''}`;
  }
  const pe = T.p;
  return { planned, penalty, ifCost, expected: planned + pe * penalty, expectedSpend: (1 - pe) * planned + pe * ifCost, pre, apt, acc, line,
    plannedLine: `運賃 ${yenJ(p.price)}${pre ? `＋予約時のオプション ${yenJ(pre)}` : ''}${apt ? `＋空港で払った手荷物料金 ${yenJ(apt)}` : ''}${acc ? `＋交通費 ${yenJ(acc)}` : ''}` };
}

/* ---------- 乱数：seed = FNV-1a(参加者ID|task番号) → mulberry32 の最初の値 ---------- */
function fnv1a(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return h >>> 0; }

function eventDraw(pid, tripKey, p) { const seed = fnv1a(`${pid}|${tripKey}`); const rand = mulberry32(seed)(); return { seed, rand: Math.round(rand * 1e6) / 1e6, occurred: rand < p }; }
function seededShuffle(arr, rnd) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* 割付表：6人ごとのブロックで6通りの順序を1回ずつ（ブロック内の並びは乱数） */
function allocationTable(n, seedStr, prefix) {
  const rnd = mulberry32(fnv1a(`alloc|${seedStr}`)), rows = [];
  let slot = 0;
  while (rows.length < n) {
    seededShuffle([1, 2, 3, 4, 5, 6], rnd).forEach(o => { if (rows.length >= n) return; slot++; rows.push({ slot, participant_id: `${prefix}${String(slot).padStart(3, '0')}`, order_no: o, order_seq: orderSeq(o), block: Math.ceil(slot / 6) }); });
  }
  return rows;
}

/* ---------- 日付（参加した日を「今日」とする） ---------- */
const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => isoDate(new Date());
const addDaysISO = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return isoDate(d); };
const WD = '日月火水木金土';
const ymdJ = s => { const d = new Date(s + 'T00:00:00'); return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const mdJ = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; };
const shortMD = s => { const d = new Date(s + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}`; };
const daysLabel = d => (d === 1 ? '前日' : `${d}日前`);

/* ---------- 理解度の4問目：選んだプランの手数料（取りやめ＝取消手数料、日程変更＝変更手数料／変更できない） ---------- */
function moneyOpts(correct, cands) { const s = [correct]; cands.forEach(v => { v = Math.max(0, Math.round(v)); if (!s.includes(v) && s.length < 4) s.push(v); }); return s.sort((a, b) => a - b).map(yenJ); }
function quizFor(trip, planId) {
  const T = trueK(trip), p = planById(planId), d = T.days, ex = exTax(p);
  return trip.quiz.map(q => {
    if (!q.dyn) return q;
    if (T.type === 'change') {
      const ch = changeRule(p, d), NG = '変更できない（取り消して買い直す）';
      const correct = ch.possible ? yenJ(ch.fee) : NG;
      const nums = []; [ch.possible ? ch.fee : null, 0, 1000, 3000, Math.round(ex * 0.1)].forEach(v => { if (v != null && !nums.includes(v) && nums.length < 3) nums.push(v); });
      return { id: q.id, dyn: true, text: `あなたが選んだプラン（${planName(p)}）で、出発の${daysLabel(d)}に別の日の便へ変えるとき、変更の手数料はいくらですか（運賃の差額は除く）。`, options: nums.sort((a, b) => a - b).map(yenJ).concat([NG]), correct };
    }
    const c = cancelRule(p, d), fee = p.price - c.cash - c.points;
    return { id: q.id, dyn: true, text: `あなたが選んだプラン（${planName(p)}）を出発の${daysLabel(d)}に取り消すと、取消手数料はいくらですか（ポイントで戻る分は、戻ったものとして考えます）。`, options: moneyOpts(fee, [0, Math.round(ex * 0.5), Math.round(ex * 0.05), 1000, 3000, 500, p.price]), correct: yenJ(fee) };
  });
}

/* ============================================================
   stats.js — 集計用の統計（参加者内3条件：Friedman・Wilcoxon・Cochran の Q・McNemar、参加者間：Kruskal–Wallis・χ²、Holm 補正）

function ticketCard(mode) {
  const c = S.cur, p = c && planById(c.selected); if (!p) return '';
  const f = flightOf(p), B = c.booking || { bags: 0, seat: 0 }, trip = c.trip, hide = mode === 'quiz';
  const bagPre = bagFees(p, B.bags, trip.truth.kg).pre, seatPre = seatFee(p, B.seat).pre;
  const bagsTxt = p.al === 'P' ? (B.bags ? `${B.bags}個分${p.kind === 'peachMin' ? '' : '（1個は運賃に含む）'}` : '予約時に追加していない') : '予約時の追加はなし';
  const seatTxt = B.seat ? `指定した${seatPre ? `（${yenJ(seatPre)}）` : '（無料）'}` : '指定していない';
  const rules = p.rules.filter(r => /予約変更|取り消し|預け手荷物/.test(r[0]));
  const body = `<div class="tk-plan">${alBadgeTK(p)}<b>${esc(planName(p))}</b></div>${c.ui === 'L' ? `<div class="tk-sub">予約サイトでの表示：エコノミークラス（${esc(p.tcName)}）</div>` : ''}
    <dl class="tk-dl"><dt>便</dt><dd>${f.no}｜${esc(AIRPORTS[f.from].name)} ${f.dep} → ${esc(AIRPORTS[f.to].name)} ${f.arr}</dd><dt>出発日</dt><dd>${esc(ymdJ(c.depDate))}</dd>
      <dt>預け手荷物</dt><dd>${esc(bagsTxt)}</dd><dt>座席指定</dt><dd>${esc(seatTxt)}</dd>
      ${hide ? '' : `<dt>予約時に払った額</dt><dd><b>${yen(p.price + bagPre + seatPre)}</b>（運賃 ${yen(p.price)}${bagPre + seatPre ? `＋オプション ${yen(bagPre + seatPre)}` : ''}）</dd>`}</dl>
    ${hide ? '<p class="tk-note">確認問題のあいだは、金額と規定（取消・変更・手荷物）は表示しません。</p>' : `<details class="tk-rules"><summary>このプランの規定（取消・変更・手荷物）</summary><dl class="tk-dl">${rules.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl></details>`}
    <p class="tk-memo"><b>予約メモ</b>：${esc(trip.summary)}</p>`;
  return `<aside class="tkt" aria-label="あなたが予約した航空チケット"><details class="tkt-m"><summary><span class="tk-k">予約したチケット</span><b>${esc(planName(p))}</b><span class="tk-o">内容を見る</span></summary><div class="tkt-in">${body}</div></details>

}

/* ---------- 集中度：画面ごとの滞在時間・ほかのタブやアプリにいた時間・操作のない時間・離れた回数 ----------
   visit = 1つの画面に入ってから出るまで。ms：滞在、hidden_ms：ページが見えていなかった時間、
   idle_ms：見えているのに30秒以上操作がなかった分（30秒を超えた部分だけ）、blur_n：ウィンドウから離れた回数 */
const IDLE_MS = 30000;
const VIS = { cur: null, lastAct: 0, hiddenAt: null };
function visitOpen(screen) {
  if (['reception', 'lab', 'resume', 'declined', 'narrow'].includes(screen) || S.preview && screen === 'lab') { VIS.cur = null; return; }
  const now = performance.now();
  VIS.cur = { s: screen, ti: S.cur && TRIAL_STEPS.includes(screen) ? S.cur.ti : null, t0: nowMs(), ms: 0, hidden_ms: 0, idle_ms: 0, blur_n: 0, hidden_n: 0 };
  VIS.lastAct = now; VIS.hiddenAt = document.visibilityState === 'hidden' ? now : null;
}
function visitClose() {
  const v = VIS.cur; if (!v) return; const now = performance.now();

function indicatorRow(rows, label, key, kind, d, testIt) {

function tableHTML(t) {

    const tc = !t.noTest;
    h += `<thead><tr><th>指標</th>${UI_COLS.map(u => `<th class="r">${esc(UI_HEAD[u])}</th>`).join('')}${tc ? `<th>全体の検定</th>${PAIRS.map(p => `<th>${p[2]}</th>`).join('')}` : ''}</tr></thead><tbody>`;
    h += t.rows.map(r => `<tr><td>${esc(r.label)}</td>${r.cells.map(c => `<td class="r">${esc(c)}</td>`).join('')}${tc ? `<td class="${r.sig ? 'sig' : ''}">${esc(r.test)}</td>${r.pairs.map((p, k) => `<td class="${r.raw && r.raw.pairs[k] && r.raw.pairs[k].p < 0.05 ? 'sig' : ''}">${esc(p)}</td>`).join('')}` : ''}</tr>`).join('');
  } else {
    h += `<thead><tr>${t.head.map((x, i) => `<th${i ? ' class="r"' : ''}>${esc(x)}</th>`).join('')}</tr></thead><tbody>`;
    h += t.body.map(r => `<tr>${r.map((c, i) => `<td${i && t.kind === 'grid' ? ' class="r"' : ''}>${esc(c)}</td>`).join('')}</tr>`).join('');
  }
  return h + '</tbody></table>';
}
function tableTSV(t) {
  const lines = [t.title];

    const order = ORDERS[a.order_no - 1], pid = a.participant_id, ab = gauss() * 0.6, trials = [];
    const profile = { answers: { AGE: pick(['20〜24歳', '20〜24歳', '25〜29歳', '18〜19歳']), GENDER: pick(['女性', '男性', '男性', '女性', '回答しない']), EXP1: pick(['年に0回', '年に1〜2回', '年に1〜2回', '年に3〜5回']), EXP2: pick(['ある', 'ない']) },
      att1_pass: rnd() < 0.95 ? 1 : 0, travel_risk: Math.round((3.5 + gauss() * 1.0) * 100) / 100 };
    TRIP_KEYS.forEach((tk, ti) => withRoute(TRIPS[tk].route, () => {
      const ui = order[ti], trip = TRIPS[tk], opt = optimalOf(trip), ev = evalAll(trueK(trip));
      const pOpt = Math.min(0.95, Math.max(0.03, base[ui] + 0.06 * ti + ab * 0.12));
      let planId;
      if (rnd() < pOpt) planId = opt;
      else { const cands = PLANS.filter(p => p.id !== opt && p.price < 30000); const w = cands.map(p => (ui === 'L' ? 1 / (p.price / 7000) ** 3 : 1 / (ev[p.id].expected / 10000) ** 4)); let s = w.reduce((x, y) => x + y, 0) * rnd(); planId = cands[cands.length - 1].id; for (let i = 0; i < cands.length; i++) { s -= w[i]; if (s <= 0) { planId = cands[i].id; break; } } }
      const p = planById(planId), T = trip.truth, needOk = rnd() < (ui === 'L' ? 0.6 : 0.85);
      const B = { bags: p.al === 'P' ? (needOk ? T.bags : 0) : 0, seat: T.seat && needOk && p.kind !== 'anaSimple' ? 1 : 0 };
      const act = actualEval(p, trip, B), byPrice = PLANS.slice().sort((a2, b2) => a2.price - b2.price), byExp = PLANS.slice().sort((x, y) => (ev[y.id].feasible - ev[x.id].feasible) || ev[x.id].expected - ev[y.id].expected);
      const d = eventDraw(pid, tk, T.p), cost = Math.round(d.occurred ? act.ifCost : act.planned), lk = (mu, sdv) => clamp(mu + gauss() * sdv + ab * 0.4, 1, 7);
      const compN = Math.max(0, Math.min(4, Math.round(4 * comp[ui] + gauss() * 0.9))), dq = {};

  return `<section class="tblock"><b>画面の確認（記録しません）</b><p class="tnote">航空チケットと画面を選んで、参加者と同じ流れ（予約メモと確認 → 画面の説明 → 予約作業 → アンケート → 結果）を1回分確かめられます。終わるとこの画面に戻ります。</p>

    ${TRIP_KEYS.map(k => withRoute(TRIPS[k].route, () => { const trip = TRIPS[k], opt = optimalOf(trip), ev = evalAll(trueK(trip)), cheap = PLANS.slice().sort((a, b) => a.price - b.price)[0]; return `<tr><td>${esc(trip.title)}</td>${UI_COLS.map(u => `<td><button class="sv-btn quiet small" data-action="lab-preview" data-v="${u}|${k}">開く</button></td>`).join('')}<td>${esc(planName(planById(opt)))}（${yen(ev[opt].expected)}）</td><td>${esc(planName(cheap))}（${yen(cheap.price)}・見込み ${yen(ev[cheap.id].expected)}）</td></tr>`; })).join('')}</tbody></table></div></section>
    ${TRIP_KEYS.map(k => withRoute(TRIPS[k].route, () => { const trip = TRIPS[k], ev = evalAll(trueK(trip)), opt = optimalOf(trip); return `<section class="tblock"><div class="tbl-wrap"><table class="rt"><caption>${esc(trip.title)}：予約メモの状況での各プランの見込み</caption><thead><tr><th>プラン</th><th class="r">運賃</th><th class="r">予定どおり</th><th class="r">もしもの別料金</th><th class="r">見込み</th><th class="r">（参考）出ていくお金の期待値</th></tr></thead><tbody>${PLANS.slice().sort((a, b) => (ev[b.id].feasible - ev[a.id].feasible) || ev[a.id].expected - ev[b.id].expected).map(p => `<tr${p.id === opt ? ' style="background:#E3F1EE;font-weight:700"' : ''}><td>${esc(planName(p))}${ev[p.id].feasible ? '' : '（座席の希望を満たさない）'}</td><td class="r">${fmtN(p.price)}</td><td class="r">${fmtN(ev[p.id].planned)}</td><td class="r">${fmtN(ev[p.id].penalty)}</td><td class="r">${fmtN(ev[p.id].expected)}</td><td class="r">${fmtN(ev[p.id].expectedSpend)}</td></tr>`).join('')}</tbody></table></div><p class="tnote">${esc(trip.brief.join(' '))}</p></section>`; })).join('')}`;
}
function afterLab() { /* noop */ }
function startPreview(ui, tripKey) {
  resetSession('PREVIEW', 1); S.preview = true; S.order = [ui]; S.trips = [tripKey]; LOG.meta.preview = true;
  beginTrial(0);
}
async function labAction(a, el) {
  const v = el.dataset.v, B = LAB.built;
  const tByID = id => (B ? B.T.find(t => t.id === id) : null);
  LAB.msg = '';
  switch (a) {
    case 'lab-open': return openLab(LAB.tab);
    case 'lab-reception': if (S.cfg.public) { resetSession(randomPid(), 1); return go('welcome'); } resetSession(randomPid(), 1); return go('reception');
    case 'lab-tab': LAB.tab = v; LAB.delArm = null; return render();
    case 'lab-src': LAB.source = v; if (v === 'demo' && !LAB.demo.length) LAB.demo = simulateSessions(36, 'demo'); return render({ keepScroll: true });
    case 'lab-demo-gen': LAB.demo = simulateSessions(36, 'demo' + Date.now()); return render({ keepScroll: true });
    case 'lab-reload': return openLab(LAB.tab);
    case 'lab-csv-long': return downloadText(`uicmp_long${LAB.source === 'demo' ? '_DEMO' : ''}.csv`, longCSV(B.rows));
    case 'lab-csv-wide': return downloadText(`uicmp_wide${LAB.source === 'demo' ? '_DEMO' : ''}.csv`, wideCSV(B.rows));
    case 'lab-r': return downloadText('uicmp_models.R', rScript());
    case 'lab-copy-r': return copyText(rScript());
    case 'lab-copy-t': return copyTable(tByID(v));
    case 'lab-tsv-t': { const t = tByID(v); return downloadText(`uicmp_${t.id}.tsv`, tableTSV(t)); }
    case 'lab-copy-all': return copyText(B.T.map(tableTSV).join('\n\n'));
    case 'lab-copy-text': return copyText(draftText(B));
    case 'lab-json': { const list = currentSessions(); return downloadText(`uicmp_sessions_${todayISO()}${LAB.source === 'demo' ? '_DEMO' : ''}.json`, JSON.stringify({ app: APP_NAME, version: APP_VERSION, exported: new Date().toISOString(), sessions: list }, null, 1)); }
    case 'lab-remote': try { const kEl = $('#lab-key'), key = kEl ? kEl.value.trim() : keyLoad(); keySave(key); const list = await fetchRemote(S.cfg.endpoint, key); let n = 0; for (const s of list) { if (s && s.pid && s.log) { const old = LAB.local.find(x => x.pid === s.pid); if (old && old.status === 'complete' && s.status !== 'complete') continue; await dbPut(s); n++; } } await openLab('data'); LAB.msg = `集めた回答から ${n}件をこの端末に取り込みました。`; } catch (e) { LAB.msg = `読み込めませんでした：${e.message || e}`; } return render();
    case 'lab-del': if (LAB.delArm !== v) { LAB.delArm = v; return render({ keepScroll: true }); } await dbDelete(v); LAB.delArm = null; LAB.msg = `${v} を削除しました。`; return openLab('data');
    case 'lab-clear': if (LAB.delArm !== '*') { LAB.delArm = '*'; return render({ keepScroll: true }); } for (const s of LAB.local) await dbDelete(s.pid); LAB.delArm = null; LAB.msg = 'この端末の回答をすべて削除しました。'; return openLab('data');
    case 'lab-save-cfg': {
      const g = id => $('#' + id);
      Object.assign(S.cfg, { idPrefix: (g('cf-prefix').value || 'P').replace(/[^\w\-]/g, '').slice(0, 12) || 'P', allocSeed: g('cf-seed').value || 'uicmp', minMinutes: Math.max(0, +g('cf-min').value || 0), minWidth: Math.max(320, +g('cf-width').value || 320),
        endpoint: /^https:\/\//.test(g('cf-ep').value.trim()) ? g('cf-ep').value.trim() : '', token: g('cf-token').value.replace(/[^\w\-]/g, '').slice(0, 64) });
      const al = allocLoad(); al.next = Math.max(1, parseInt(g('cf-next').value, 10) || 1); allocSave(al);
      const save = Object.assign({}, S.cfg); delete save.mode; delete save.fast; cfgSave(save); LAB.msg = '設定を保存しました。'; return render();
    }
    case 'lab-alloc-csv': { const base = location.href.split('?')[0].split('#')[0], rows = allocationTable(120, S.cfg.allocSeed, S.cfg.idPrefix);
      return downloadText('uicmp_allocation.csv', ['slot,participant_id,order_no,order_seq,block,url'].concat(rows.map(r => [r.slot, r.participant_id, r.order_no, r.order_seq, r.block, csvCell(`${base}?mode=exp&pid=${r.participant_id}&order=${r.order_no}${S.cfg.endpoint ? `&endpoint=${encodeURIComponent(S.cfg.endpoint)}` : ''}${S.cfg.token ? `&token=${S.cfg.token}` : ''}`)].join(','))).join('\r\n')); }
    case 'lab-preview': { const [u, k] = v.split('|'); return startPreview(u, k); }
    default: return undefined;
  }
}
async function labChange(a, el) {
  if (a === 'lab-excl') { LAB.excl[el.dataset.v] = el.checked; return render({ keepScroll: true }); }
  if (a === 'lab-import') {
    let n = 0, skipped = 0;
    for (const f of Array.from(el.files || [])) {
      try { const j = JSON.parse(await readFileText(f)); const list = Array.isArray(j) ? j : (j.sessions || (j.pid ? [j] : []));
        for (const s of list) { if (!s || !s.pid || !s.log) continue; if (s.demo) { skipped++; continue; } const old = LAB.local.find(x => x.pid === s.pid); if (old && old.status === 'complete' && s.status !== 'complete') continue; await dbPut(s); n++; } }
      catch (e) { LAB.msg = `${f.name} を読み込めませんでした`; }
    }
    LAB.source = 'local'; await openLab('data');
    LAB.msg = `${n}件の回答をこの端末に取り込みました${skipped ? `（架空のデータ ${skipped}件は取り込みません）` : ''}。同じ参加者IDは新しい記録で上書きします。`; return render();
  }
}

boot();
})();
